<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff5fa2">
  <title>I Coupon di Compleanno di Pucla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap">
  <style>
    :root {
      --pink: #ff5fa2;
      --purple: #8b5cf6;
      --ink: #3b1f4a;
      --mint: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Fredoka', sans-serif;
      color: var(--ink);
      background: linear-gradient(155deg, #ff9a8b 0%, #ff6a88 35%, #c86dd7 75%, #8b5cf6 100%);
      padding: 24px 16px 48px;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }
    .header-card {
      position: relative;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      padding: 24px 20px 20px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(59, 31, 74, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 22px;
    }
    .mascot-row {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }
    .mascot-row img {
      width: 58px;
      height: 58px;
      margin: 0 8px;
      object-fit: contain;
    }
    .badge-31 {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      margin: 4px 0 8px;
      font-size: 26px;
      color: var(--ink);
      line-height: 1.15;
    }
    p.sub {
      margin: 0;
      font-size: 15px;
      opacity: 0.8;
      line-height: 1.4;
    }
    .coupon-list {
      display: flex;
      flex-direction: column;
    }
    .coupon {
      position: relative;
      background: linear-gradient(135deg, #ffffff 0%, #fff6fa 100%);
      border-radius: 22px;
      padding: 18px 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(59, 31, 74, 0.2);
      border: 2px dashed rgba(255, 95, 162, 0.45);
      display: flex;
      align-items: center;
      transition: transform 0.2s, opacity 0.2s;
      overflow: hidden;
    }
    .coupon.used {
      opacity: 0.72;
      background: #f5f0f7;
      border-color: rgba(139, 92, 246, 0.35);
    }
    .c-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffe3ef, #f3e8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
      margin-right: 14px;
    }
    .c-body {
      flex: 1;
      min-width: 0;
    }
    .c-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--pink);
      letter-spacing: 0.05em;
    }
    .c-title {
      font-size: 19px;
      font-weight: 700;
      margin: 2px 0 4px;
      color: var(--ink);
    }
    .c-text {
      font-size: 14px;
      opacity: 0.8;
      line-height: 1.35;
    }
    .c-btn {
      margin-left: 10px;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 4px 0 #6b2fb3;
      flex-shrink: 0;
    }
    .coupon.used .c-btn {
      background: var(--mint);
      box-shadow: 0 4px 0 #059669;
    }
    .footer-note {
      text-align: center;
      color: #fff;
      font-family: 'Caveat', cursive;
      font-size: 24px;
      margin-top: 18px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header-card">
      <div class="mascot-row">
        <img src="/birthday/assets/hello-kitty.svg" alt="Hello Kitty">
        <img src="/birthday/assets/kuromi.svg" alt="Kuromi">
        <img src="/birthday/assets/mymelody.svg" alt="My Melody">
      </div>
      <span class="badge-31" id="cp-badge">Buon 31° Compleanno</span>
      <h1 id="cp-title">I Coupon Regalo di Pucla</h1>
      <p class="sub">Mostra questa schermata a Gianmarco quando vuoi riscattare uno dei tuoi premi vinti!</p>
    </div>

    <div class="coupon-list" id="cp-list"></div>

    <div class="footer-note" id="cp-footer">Con tutto il mio amore, Il tuo Gianmarco</div>
  </div>

  <script>
    (function () {
      var STORE = 'pucla-coupons-used-v1';
      var used = {};
      try { used = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}

      function save() {
        try { localStorage.setItem(STORE, JSON.stringify(used)); } catch (e) {}
      }

      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/birthday?t=' + Date.now(), true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || xhr.status !== 200) return;
        try {
          var cfg = JSON.parse(xhr.responseText);
          var name = cfg.name || 'Pucla';
          var age = cfg.age || 31;
          document.getElementById('cp-badge').textContent = 'Buon ' + age + '° Compleanno ' + name;
          document.getElementById('cp-title').textContent = 'I Coupon Regalo di ' + name;
          if (cfg.from) {
            document.getElementById('cp-footer').textContent = 'Con tutto il mio amore, ' + cfg.from;
          }
          var cards = (cfg.scratch && cfg.scratch.cards) || [];
          var list = document.getElementById('cp-list');
          list.innerHTML = '';
          for (var i = 0; i < cards.length; i++) {
            (function (idx, c) {
              var div = document.createElement('div');
              div.className = 'coupon' + (used[idx] ? ' used' : '');
              div.innerHTML =
                '<div class="c-icon">' + (c.icon || '🎁') + '</div>' +
                '<div class="c-body">' +
                  '<div class="c-tag">Coupon #' + (idx + 1) + ' • Valido sempre</div>' +
                  '<div class="c-title">' + (c.title || '') + '</div>' +
                  '<div class="c-text">' + (c.text || '') + '</div>' +
                '</div>' +
                '<button class="c-btn">' + (used[idx] ? 'Usato ✓' : 'Usa ora') + '</button>';
              div.querySelector('.c-btn').onclick = function () {
                used[idx] = !used[idx];
                save();
                div.className = 'coupon' + (used[idx] ? ' used' : '');
                this.textContent = used[idx] ? 'Usato ✓' : 'Usa ora';
              };
              list.appendChild(div);
            })(i, cards[i]);
          }
        } catch (e) {}
      };
      xhr.send();
    })();
  </script>
</body>
</html>
