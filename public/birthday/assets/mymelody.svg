<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <defs>
    <filter id="shadow-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Cappuccio Rosa con Orecchie Lunghe -->
  <path d="M 55,24 C 36,24 22,40 22,66 C 22,86 38,98 55,98 C 72,98 88,86 88,66 C 88,40 74,24 55,24 Z" fill="#ff7fa8" stroke="#222222" stroke-width="4" filter="url(#shadow-m)"/>
  <!-- Orecchio Sinistro lungo -->
  <path d="M 36,36 C 30,18 20,2 14,3 C 8,4 12,20 22,44 Z" fill="#ff7fa8" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
  <!-- Orecchio Destro lungo (piegato dolcemente) -->
  <path d="M 74,36 C 80,18 90,2 96,3 C 102,4 98,20 88,44 Z" fill="#ff7fa8" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
  <!-- Faccina Bianca Ovale -->
  <ellipse cx="55" cy="68" rx="25" ry="21" fill="#ffffff" stroke="#222222" stroke-width="3.5"/>
  <!-- Occhi My Melody -->
  <ellipse cx="44" cy="67" rx="3.5" ry="5.5" fill="#222222"/>
  <ellipse cx="66" cy="67" rx="3.5" ry="5.5" fill="#222222"/>
  <!-- Ciglia carine -->
  <line x1="38" y1="63" x2="35" y2="61" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="63" x2="75" y2="61" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  <!-- Nasino Giallo -->
  <ellipse cx="55" cy="73" rx="4" ry="3" fill="#ffcf33" stroke="#222222" stroke-width="2"/>
  <path d="M 51,79 Q 55,83 59,79" fill="none" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fiorellino o Fiocchetto sul cappuccio -->
  <g transform="translate(32, 42)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#222222" stroke-width="3"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffcf33"/>
  </g>
</svg>
