  <circle cx="106" cy="4" r="5.5" fill="#ff66b2" stroke="#18161e" stroke-width="2.5"/>
  <!-- Faccina Bianca -->
  <path d="M 55,38 C 38,38 30,50 30,66 C 30,82 40,90 55,90 C 70,90 80,82 80,66 C 80,50 72,38 55,38 Z" fill="#ffffff" stroke="#18161e" stroke-width="3.5"/>
  <!-- Teschietto Rosa sulla fronte -->
  <g transform="translate(55, 30)">
    <circle cx="0" cy="0" r="7" fill="#ff66b2"/>
    <ellipse cx="0" cy="5" rx="4" ry="3.5" fill="#ff66b2"/>
    <!-- Occhietti teschio -->
    <circle cx="-2.8" cy="0" r="1.6" fill="#26242c"/>
    <circle cx="2.8" cy="0" r="1.6" fill="#26242c"/>
  </g>
  <!-- Occhi Kuromi furbetti -->
  <path d="M 40,62 Q 44,56 46,65" fill="none" stroke="#18161e" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="43" cy="65" rx="3.5" ry="5.5" fill="#18161e"/>
  <path d="M 70,62 Q 66,56 64,65" fill="none" stroke="#18161e" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="67" cy="65" rx="3.5" ry="5.5" fill="#18161e"/>
  <!-- Ciglia -->
  <line x1="37" y1="58" x2="34" y2="55" stroke="#18161e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="73" y1="58" x2="76" y2="55" stroke="#18161e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nasino e Sorrisetto malefico/dolce -->
  <circle cx="55" cy="71" r="2.2" fill="#ff99cc"/>
  <path d="M 48,76 Q 55,83 62,76" fill="none" stroke="#18161e" stroke-width="3" stroke-linecap="round"/>
