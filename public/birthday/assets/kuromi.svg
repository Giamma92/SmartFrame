<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <defs>
    <filter id="shadow-k" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Cuffia Nera con Orecchie a Punta -->
  <path d="M 55,20 C 35,20 20,38 20,62 C 20,84 36,98 55,98 C 74,98 90,84 90,62 C 90,38 75,20 55,20 Z" fill="#26242c" stroke="#18161e" stroke-width="4" filter="url(#shadow-k)"/>
  <!-- Orecchio Sinistro con pallina viola/rosa -->
  <path d="M 32,35 C 22,25 6,2 3,2 C 1,2 0,12 8,28 C 16,42 24,46 32,48 Z" fill="#26242c" stroke="#18161e" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="4" cy="4" r="5.5" fill="#ff66b2" stroke="#18161e" stroke-width="2.5"/>
  <!-- Orecchio Destro con pallina -->
